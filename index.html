<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>HAKO Angebot</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#f5f2ee;--sur:#fff;--brd:#e2ddd7;--txt:#1a1714;--mut:#8a8279;--red:#E8441A;--redl:#fef0ec;--blue:#3B8FD4;--shd:0 2px 12px rgba(0,0,0,.06);}
body{background:var(--bg);font-family:'Segoe UI',Arial,sans-serif;font-size:15px;color:var(--txt);}
input,select,textarea,button{font-family:inherit;font-size:inherit;}
input:focus,select:focus,textarea:focus{outline:none;}
button{cursor:pointer;}
#home-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center;min-height:100vh;background:var(--bg);}
#pin-screen{display:none;align-items:center;justify-content:center;padding:24px;min-height:100vh;background:var(--bg);}
#admin-screen,#angebot-screen,#settings-screen{display:none;min-height:100vh;background:var(--bg);}
#vorschau-screen{display:none;min-height:100vh;background:#eee;padding:16px 12px;}
#folder-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:500;align-items:flex-end;justify-content:center;}
.fmbox{background:white;border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:80vh;display:flex;flex-direction:column;}
.lbox{background:white;border-radius:16px;padding:20px 24px;margin-bottom:24px;box-shadow:var(--shd);display:inline-block;}
.lbox img{width:240px;height:auto;}
.bp{background:var(--red);color:white;border:none;padding:16px;border-radius:12px;font-size:1rem;font-weight:700;width:100%;max-width:380px;display:block;margin:0 auto 12px;}
.bs{background:var(--sur);color:var(--txt);border:1px solid var(--brd);padding:14px;border-radius:12px;font-size:0.9rem;width:100%;max-width:380px;display:block;margin:0 auto 10px;}
.bm{background:var(--blue);color:white;border:none;padding:14px;border-radius:12px;font-size:0.9rem;width:100%;max-width:380px;display:block;margin:0 auto;}
.topbar{background:var(--sur);border-bottom:1px solid var(--brd);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shd);}
.topbar img{height:34px;width:auto;}.tbr{text-align:right;}.tbnr{font-size:0.7rem;color:var(--mut);}.tbtot{font-weight:800;font-size:1.1rem;color:var(--red);}
.bbk{background:none;border:none;color:var(--mut);font-size:1.3rem;padding:4px 10px 4px 0;}
.content{max-width:680px;margin:0 auto;padding:16px 12px 120px;}
.card{background:var(--sur);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shd);}
.ct{font-weight:700;font-size:0.9rem;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--red);}
.dot{width:10px;height:10px;background:var(--red);border-radius:2px;flex-shrink:0;display:inline-block;}
.fi{margin-bottom:12px;}.fi label{display:block;font-size:0.7rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--mut);margin-bottom:4px;}
.fi input,.fi textarea{width:100%;padding:10px 12px;border:1px solid var(--brd);border-radius:8px;background:var(--bg);font-size:0.88rem;color:var(--txt);}
.fi textarea{resize:vertical;line-height:1.6;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.full{grid-column:1/-1;}
.pr{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:10px 8px;border-radius:9px;margin-bottom:5px;cursor:pointer;}
.pa{background:var(--redl);border:1px solid rgba(232,68,26,.2);}.pi{background:var(--bg);border:1px solid transparent;}
.ck{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:0.7rem;font-weight:800;}
.ckon{background:var(--red);border:2px solid var(--red);color:white;}.ckoff{background:transparent;border:2px solid var(--brd);color:transparent;}
.pb{margin-left:6px;font-size:0.6rem;background:var(--red);color:white;padding:1px 5px;border-radius:3px;}
.pp{text-align:right;}.pon{font-size:0.88rem;font-weight:600;color:var(--red);}.poff{font-size:0.88rem;font-weight:600;color:var(--mut);}
.pu{font-size:0.68rem;color:var(--mut);}
.mr{display:flex;align-items:center;gap:6px;margin-top:6px;}
.mb{width:28px;height:28px;border-radius:6px;border:1px solid var(--brd);background:white;font-weight:700;font-size:1rem;display:flex;align-items:center;justify-content:center;padding:0;}
.mi{width:58px;text-align:center;padding:4px 6px;border:1px solid var(--brd);border-radius:6px;font-size:0.85rem;background:white;}
.mu{font-size:0.78rem;color:var(--mut);}
.sumbox{background:var(--txt);border-radius:14px;padding:20px;color:white;box-shadow:0 4px 20px rgba(0,0,0,.15);}
.sr{display:flex;justify-content:space-between;margin-bottom:8px;font-size:0.88rem;}
.fab{position:fixed;bottom:20px;right:16px;z-index:200;background:var(--red);color:white;border:none;padding:14px 22px;border-radius:50px;font-weight:700;font-size:0.9rem;box-shadow:0 4px 20px rgba(232,68,26,.4);}
.pbox{background:var(--sur);border-radius:20px;padding:36px;width:100%;max-width:340px;box-shadow:var(--shd);text-align:center;}
.pbox img{width:200px;margin-bottom:20px;}.pi2{width:100%;padding:14px;text-align:center;font-size:1.6rem;letter-spacing:0.3em;border:2px solid var(--brd);border-radius:10px;background:var(--bg);margin-bottom:8px;}
.pe{color:var(--red);font-size:0.8rem;margin-bottom:8px;display:none;}
.bpin{width:100%;background:var(--red);color:white;border:none;padding:13px;border-radius:10px;font-weight:700;margin-bottom:10px;font-size:1rem;}
.bcan{background:none;border:none;color:var(--mut);font-size:0.85rem;}
.ac{background:var(--sur);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shd);}
.acn{font-weight:700;font-size:0.95rem;background:none;border:none;border-bottom:2px solid var(--red);padding-bottom:3px;width:100%;margin-bottom:12px;color:var(--txt);}
.ag{display:grid;grid-template-columns:1fr 100px 80px 28px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--brd);}
.ah{font-size:0.67rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);}
.ani{background:var(--bg);border:1px solid transparent;border-radius:6px;padding:6px 8px;font-size:0.82rem;color:var(--txt);width:100%;}
.api{background:var(--redl);border:1px solid rgba(232,68,26,.2);border-radius:6px;padding:6px 8px;font-size:0.88rem;font-weight:600;color:var(--red);text-align:right;width:100%;}
.at{font-size:0.7rem;color:var(--mut);line-height:1.4;}.atp{display:block;color:var(--red);font-size:0.63rem;}
.bdel{background:none;border:none;color:#ccc;font-size:1.1rem;padding:2px;}
.badd{margin-top:10px;background:none;border:1px dashed var(--brd);color:var(--mut);padding:7px;border-radius:8px;font-size:0.78rem;width:100%;}
.bak{background:none;border:2px dashed var(--brd);color:var(--mut);padding:14px;border-radius:12px;font-size:0.88rem;width:100%;margin-bottom:40px;}
.bdon{background:var(--txt);color:white;border:none;padding:9px 18px;border-radius:8px;font-weight:700;font-size:0.85rem;}
.bres{background:none;border:1px solid var(--brd);color:var(--mut);padding:8px 12px;border-radius:8px;font-size:0.78rem;margin-right:6px;}
.ptb{display:flex;gap:8px;justify-content:flex-end;margin-bottom:16px;flex-wrap:wrap;}
.bed{background:var(--sur);border:1px solid var(--brd);color:var(--txt);padding:10px 16px;border-radius:8px;font-size:0.85rem;}
.bpr{background:var(--red);color:white;border:none;padding:10px 18px;border-radius:8px;font-weight:700;font-size:0.85rem;}
.doc{background:white;border-radius:16px;padding:28px 24px;box-shadow:0 4px 24px rgba(0,0,0,.09);max-width:700px;margin:0 auto;}
.dh{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:14px;border-bottom:3px solid var(--red);margin-bottom:6px;}
.db{height:3px;background:var(--blue);opacity:.35;border-radius:2px;margin-bottom:18px;}
.dk{font-size:.72rem;font-weight:700;text-transform:uppercase;color:white;background:var(--red);padding:4px 9px;border-radius:4px;margin-bottom:6px;display:inline-block;letter-spacing:.06em;}
.dp{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:6px 0;border-bottom:1px solid #f0ede8;align-items:baseline;}
.dpn{font-size:.86rem;}.dps{font-size:.7rem;color:var(--mut);}.dpt{font-size:.7rem;color:var(--mut);white-space:nowrap;}
.dpa{font-weight:500;font-size:.86rem;text-align:right;white-space:nowrap;}
.ds{margin-top:20px;padding-top:14px;border-top:2px solid var(--txt);}
.dsi{max-width:260px;margin-left:auto;}.dsr{display:flex;justify-content:space-between;font-size:.86rem;margin-bottom:7px;}
.dst{display:flex;justify-content:space-between;padding-top:8px;border-top:2px solid var(--txt);margin-top:4px;}
.dst span:first-child{font-weight:800;font-size:1.1rem;}.dst span:last-child{font-weight:800;font-size:1.1rem;color:var(--red);}
.dn{margin-top:16px;padding:12px;background:var(--bg);border-radius:8px;border-left:3px solid var(--blue);}
.dnl{font-size:.67rem;color:var(--mut);margin-bottom:3px;text-transform:uppercase;letter-spacing:.07em;}
.df{margin-top:28px;padding-top:12px;border-top:1px solid var(--brd);display:flex;justify-content:space-between;align-items:flex-end;}
.frow{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--brd);background:white;}
.frow.sel{background:var(--redl);}
.frow-name{font-size:0.9rem;font-weight:500;flex:1;}
.frow-btn{background:var(--blue);color:white;border:none;padding:6px 14px;border-radius:6px;font-size:0.8rem;font-weight:600;flex-shrink:0;margin-left:10px;}
@media print{.ptb,.fab,.noprint{display:none!important;}body{background:white;}.doc{box-shadow:none;border-radius:0;}}
</style>
</head>
<body>
<div id="home-screen">
  <div class="lbox"><img id="hl" alt="HAKO"/></div>
  <h1 style="font-size:1.5rem;font-weight:800;margin-bottom:6px;">Angebots-Tool</h1>
  <p style="color:var(--mut);font-size:0.88rem;margin-bottom:32px;line-height:1.6;">Waermepumpen &middot; PV &middot; Smarthome</p>
  <button class="bp" id="h1">+ Neues Angebot erstellen</button>
  <button class="bs" id="h2">Preise verwalten (Admin)</button>
  <button class="bm" id="h3">&#128279; Memomeister verbinden</button>
  <p style="color:var(--mut);font-size:0.72rem;margin-top:24px;">Daten bleiben lokal auf diesem Geraet</p>
</div>
<div id="pin-screen">
  <div class="pbox"><img id="pl" alt="HAKO"/>
    <h2 style="font-weight:700;margin-bottom:6px;">Admin-Bereich</h2>
    <p style="color:var(--mut);font-size:0.82rem;margin-bottom:20px;">Standard-PIN: 1234</p>
    <input type="password" id="pin-input" class="pi2" placeholder="PIN" maxlength="8"/>
    <div class="pe" id="pin-err">Falsche PIN</div>
    <button class="bpin" id="p1">Oeffnen</button><br/>
    <button class="bcan" id="p2">Abbrechen</button>
  </div>
</div>
<div id="settings-screen">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:8px;"><button class="bbk" id="s0">&#8592;</button><img id="sl" style="height:32px;" alt="HAKO"/></div>
    <div style="font-weight:700;font-size:0.9rem;color:var(--blue)">Memomeister</div>
  </div>
  <div class="content"><div id="settings-box"></div></div>
</div>
<div id="admin-screen">
  <div class="content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
      <div><img id="al" style="height:36px;" alt="HAKO"/>
        <div style="font-weight:800;font-size:1.1rem;margin-top:6px;">Preise &amp; Positionen</div>
        <div style="color:var(--mut);font-size:0.75rem;">Aenderungen fuer diese Sitzung</div>
      </div>
      <div><button class="bres" id="a1">Reset</button><button class="bdon" id="a2">Fertig</button></div>
    </div>
    <div id="admin-list"></div>
    <button class="bak" id="a3">+ Neue Kategorie</button>
  </div>
</div>
<div id="angebot-screen">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:8px;"><button class="bbk" id="ag0">&#8592;</button><img id="agl" style="height:32px;" alt="HAKO"/></div>
    <div class="tbr"><div class="tbnr" id="topbar-nr"></div><div class="tbtot" id="topbar-total">0 EUR</div></div>
  </div>
  <div class="content">
    <div class="card"><div class="ct">Kundendaten</div>
      <div class="g2">
        <div class="fi"><label>Name / Firma</label><input id="k-name" placeholder="Max Mustermann"/></div>
        <div class="fi"><label>Telefon</label><input id="k-tel" placeholder="+49 711"/></div>
        <div class="fi full"><label>Adresse</label><input id="k-adr" placeholder="Musterstr. 1, 70173 Stuttgart"/></div>
        <div class="fi"><label>Datum</label><input id="k-datum"/></div>
      </div>
    </div>
    <div id="pos-list"></div>
    <div class="card"><div class="ct"><span class="dot"></span> Konditionen</div>
      <div class="fi"><label>Rabatt (%)</label><input type="number" id="rabatt" value="0" min="0" max="30"/></div>
      <div class="fi"><label>Notizen</label><textarea id="notiz" rows="3" placeholder="z.B. Altanlage vorhanden..."></textarea></div>
    </div>
    <div class="sumbox" id="sumbox"></div>
  </div>
  <button class="fab" id="ag1">Vorschau &#8594;</button>
</div>
<div id="vorschau-screen">
  <div class="ptb noprint">
    <button class="bed" id="v1">&#8592; Bearbeiten</button>
    <button class="bpr" id="v2">Drucken / PDF</button>
    <button id="v3" style="display:none;background:var(--blue);color:white;border:none;padding:10px 16px;border-radius:8px;font-weight:700;font-size:0.85rem;">In Memomeister speichern</button>
  </div>
  <div id="msb" class="noprint" style="display:none;max-width:700px;margin:0 auto 12px;padding:10px 14px;border-radius:8px;font-size:0.85rem;"></div>
  <div class="doc" id="doc-content"></div>
</div>
<div id="folder-modal">
  <div class="fmbox">
    <div style="padding:16px 18px;border-bottom:1px solid var(--brd);flex-shrink:0;">
      <div style="font-weight:800;font-size:1rem;margin-bottom:4px;">Ordner auswaehlen</div>
      <div id="fbc" style="font-size:0.75rem;color:var(--blue);font-weight:500;">Stammverzeichnis</div>
    </div>
    <button id="fb1" style="display:none;margin:10px 18px 0;background:none;border:1px solid var(--brd);padding:8px 14px;border-radius:8px;font-size:0.85rem;color:var(--txt);text-align:left">&#8592; Zurueck</button>
    <div id="folder-list" style="flex:1;overflow-y:auto;min-height:100px;"></div>
    <div style="padding:14px 18px;border-top:1px solid var(--brd);display:flex;gap:10px;flex-shrink:0;">
      <button id="fb2" style="flex:1;background:none;border:1px solid var(--brd);padding:13px;border-radius:10px;font-size:0.9rem;color:var(--mut);">Abbrechen</button>
      <button id="fb3" style="flex:2;background:var(--blue);color:white;border:none;padding:13px;border-radius:10px;font-weight:700;font-size:0.9rem;">Hier speichern</button>
    </div>
  </div>
</div>
